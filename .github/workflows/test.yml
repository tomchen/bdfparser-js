name: Test

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.editorconfig'
    branches:
      - main
      - master
      - 'v*'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.editorconfig'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22', '24']

    steps:
      # .gitattributes keeps LF line endings (byte-identical BDF round trips on Windows)
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      # vitest 5 needs Node.js >= 22.12: the full suite runs on Node.js 22 and
      # 24; on Node.js 20 only the built library is checked (below)
      - name: Test
        if: matrix.node != '20'
        run: bun run test:cov
      - name: Build
        run: bun run build
      - name: Check the published type declarations (no DOM / Node.js types)
        run: node tools/check-dts.mjs
      - name: Smoke-test the CLI
        run: node dist/cli.js info test/fonts/spec_example_fixed.bdf
      # the library must give the same bytes in every runtime (their
      # TextDecoder implementations differ, e.g. windows-1252 in Node.js 20)
      - name: Check the build in Node.js
        run: node tools/check-runtime.mjs
      - name: Check the build in Bun
        run: bun tools/check-runtime.mjs
      - uses: denoland/setup-deno@v2
        if: matrix.node == '24'
        with:
          deno-version: v2.x
      - name: Check the build in Deno
        if: matrix.node == '24'
        run: deno run --allow-read tools/check-runtime.mjs
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
